<title>Emilimpio Brayam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --emerald: #1FA766;
    --emerald-dark: #16824F;
    --emerald-soft: #EAF8F0;
    --navy: #111111;
    --navy-light: #2158CF;
    --navy-soft: #EBF1FC;
    --ink: #111111;
    --ink-soft: #565D66;
    --muted: #9AA1AC;
    --line: #ECEDF0;
    --line-soft: #F3F4F6;
    --ground: #F8F9FA;
    --surface: #FFFFFF;
    --red: #D6473F;
    --red-soft: #FCECEB;
    --font-display: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
    --radius-lg: 16px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-card: 0 1px 2px rgba(17,17,17,.04), 0 1px 6px rgba(17,17,17,.04);
    --shadow-pop: 0 16px 40px -12px rgba(17,17,17,.16);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  h1,h2,h3,h4 { font-family: var(--font-display); color: var(--navy); font-weight: 700; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; }
  .tabular { font-variant-numeric: tabular-nums; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #E3E5E9; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #CFD2D8; }

  /* ---------- App shell ---------- */
  #app { min-height: 100%; }

  .shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  .sidebar {
    width: 264px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 18px 16px; border-bottom: 1px solid var(--line-soft); }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    flex-shrink: 0; box-shadow: 0 0 0 1px var(--line-soft);
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-caption { font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }

  .field-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

  .suc-box { padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
  .suc-box select { width: 100%; margin-top: 6px; }
  .sim-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: var(--navy-soft); color: var(--navy-light); border-bottom: 1px solid var(--line);
    padding: 10px 20px; font-size: 12.5px; font-weight: 600;
  }
  .sim-banner .btn { flex-shrink: 0; }

  .nav-link {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-weight: 500; font-size: 13.5px; text-decoration: none;
    border: none; background: none; width: 100%; text-align: left; margin-bottom: 2px;
    transition: background-color .12s, color .12s;
  }
  .nav-link:hover { background: var(--line-soft); color: var(--ink); }
  .nav-link.active { background: var(--ink); color: #fff; font-weight: 600; }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; opacity: .85; }

  .sidebar-foot { padding: 14px; border-top: 1px solid var(--line-soft); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .who-card { background: var(--ground); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .who-name { font-weight: 700; color: var(--navy); font-size: 13.5px; }
  .who-role { font-size: 11.5px; color: var(--muted); }

  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
    border-bottom: 1px solid var(--line); padding: 20px 28px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -.015em; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .view-body { padding: 26px 28px 44px; flex: 1; }

  .menu-btn { display: none; }

  @media (max-width: 860px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%); transition: transform .22s ease; box-shadow: var(--shadow-pop); }
    .sidebar.open { transform: translateX(0); }
    .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 35; }
    .menu-btn { display: inline-flex; }
    .view-body { padding: 16px 14px 32px; }
    .topbar { padding: 12px 14px; }
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; padding: 10px 16px;
    border: 1px solid transparent; transition: filter .12s, background-color .12s, border-color .12s; white-space: nowrap;
  }
  .btn:disabled { opacity: .42; cursor: not-allowed; }
  .btn-primary { background: var(--navy-light); color: #fff; }
  .btn-primary:not(:disabled):hover { background: #1A48AC; }
  .btn-accent { background: var(--navy-light); color: #fff; }
  .btn-accent:not(:disabled):hover { background: #1A48AC; }
  .btn-ghost { background: var(--surface); color: var(--ink-soft); border-color: var(--line); }
  .btn-ghost:not(:disabled):hover { background: var(--line-soft); border-color: var(--line); }
  .btn-danger-text { color: var(--red); font-weight: 600; background: none; border: none; font-size: 12.5px; }
  .btn-link { color: var(--navy-light); font-weight: 600; background: none; border: none; font-size: 12.5px; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon { width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; font-weight: 600; color: var(--ink); }

  /* ---------- Inputs ---------- */
  .input, select.input, textarea.input {
    width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px 13px; font-size: 13.5px; background: var(--surface); color: var(--ink);
    transition: border-color .12s, box-shadow .12s;
  }
  .input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(33,88,207,.14); }
  label.field { display: block; }
  label.field + label.field { margin-top: 10px; }

  /* ---------- Cards / surfaces ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 19px; box-shadow: var(--shadow-card); }
  .kpi-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
  .kpi-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.015em; margin-top: 6px; color: var(--ink); }
  .kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: 10.5px; font-weight: 600; border: 1px solid transparent; }
  .badge-gray { background: var(--line-soft); color: var(--ink-soft); border-color: var(--line); }
  .badge-emerald { background: var(--emerald-soft); color: var(--emerald-dark); border-color: rgba(22,130,79,.20); }
  .badge-navy { background: var(--line-soft); color: var(--ink); border-color: var(--line); }
  .badge-blue { background: rgba(33,88,207,.08); color: var(--navy-light); border-color: rgba(33,88,207,.22); }
  .badge-red { background: var(--red-soft); color: var(--red); border-color: rgba(214,71,63,.20); }
  .badge-mayoreo { background: var(--emerald-soft); color: var(--emerald-dark); font-weight: 700; padding: 4px 11px; border: 1px solid rgba(22,130,79,.20); }

  table.dtable { font-size: 13px; }
  table.dtable th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.dtable td { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  table.dtable tr:last-child td { border-bottom: none; }
  table.dtable tbody tr:hover { background: var(--line-soft); }
  .table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-card); }

  .empty-row { text-align: center; color: var(--muted); padding: 34px 12px !important; }

  /* ---------- Modal ---------- */
  .modal-scrim { position: fixed; inset: 0; background: rgba(17,17,17,.42); backdrop-filter: blur(2px); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-pad { padding: 24px; }

  /* ---------- Login ---------- */
  .login-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--surface); }
  .login-card { width: 100%; max-width: 360px; }

  /* ---------- Product grid ---------- */
  .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px,1fr)); gap: 13px; }
  .prod-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 15px; box-shadow: var(--shadow-card); transition: box-shadow .12s, border-color .12s; }
  .prod-card:not(:disabled):hover { border-color: var(--navy-light); box-shadow: var(--shadow-pop); }
  .prod-card:disabled { opacity: .4; cursor: not-allowed; }
  .prod-photo { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; border: 1px solid var(--line-soft); }
  .prod-name { font-weight: 700; color: var(--ink); font-size: 13.5px; margin-top: 10px; line-height: 1.25; }

  .search-wrap { position: relative; max-width: 420px; margin-bottom: 14px; }
  .search-dropdown { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); max-height: 340px; overflow-y: auto; z-index: 30; }
  .search-dropdown-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 15px; cursor: pointer; border-bottom: 1px solid var(--line-soft); }
  .search-dropdown-item:last-child { border-bottom: none; }
  .search-dropdown-item:hover { background: var(--line-soft); }
  .search-dropdown-item.dd-disabled { cursor: not-allowed; opacity: .45; }
  .search-dropdown-empty { padding: 16px 14px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* ---------- Buscador principal de venta ---------- */
  .venta-search-hero { padding: 22px 28px 10px; flex-shrink: 0; }
  .search-wrap-hero { max-width: 680px; margin-bottom: 0; }
  .search-wrap-hero .input-hero {
    font-size: 16px; font-weight: 500; padding: 18px 20px 18px 50px; border-radius: var(--radius-md);
    border: 1px solid var(--line); box-shadow: var(--shadow-card);
  }
  .search-wrap-hero .input-hero:focus { border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(33,88,207,.12); }
  .search-wrap-hero .search-icon { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); font-size: 17px; pointer-events: none; opacity: .4; }
  .venta-sub-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 0 12px; }

  /* ---------- Venta split ---------- */
  .venta-split { display: grid; grid-template-columns: 1fr 380px; align-items: start; flex: 1; min-height: 0; }
  .venta-left { overflow-y: auto; padding: 6px 20px 30px; height: 100%; }
  .venta-cart { border-left: 1px solid var(--line); background: var(--surface); height: 100%; display: flex; flex-direction: column; }
  .venta-mobile-bar { display: none; }
  @media (max-width: 980px) {
    .venta-split { grid-template-columns: 1fr; flex: none; height: auto; }
    .venta-cart { border-left: none; border-top: 1px solid var(--line); height: auto; }
    .venta-mobile-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface);
      border-top: 1px solid var(--line); padding: 10px 16px; box-shadow: 0 -6px 18px rgba(15,23,42,.10);
    }
    .venta-left.con-barra-movil { padding-bottom: 90px; }
  }

  /* ---------- Acceso rápido (Venta) ---------- */
  .quick-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 14px; }
  .quick-chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 9px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 10px 14px; box-shadow: var(--shadow-card);
    text-align: left;
  }
  .quick-chip:not(:disabled):hover { border-color: var(--navy-light); }
  .quick-chip:disabled { opacity: .4; cursor: not-allowed; }
  .quick-chip .prod-name { margin-top: 0; font-size: 12.5px; }

  .cart-scroll { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .cart-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--ground); border-radius: var(--radius-sm); padding: 10px 13px; }

  /* ---------- Conteo físico ---------- */
  .conteo-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line-soft); }
  .conteo-row:last-child { border-bottom: none; }
  .conteo-info { flex: 1; min-width: 0; }
  .conteo-nombre { font-weight: 700; color: var(--navy); font-size: 13.5px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conteo-sub { font-size: 11.5px; color: var(--muted); margin: 1px 0 0; }
  .conteo-actual { font-weight: 600; color: var(--ink-soft); font-size: 12.5px; flex-shrink: 0; width: 60px; text-align: right; }
  .conteo-input-wrap { position: relative; flex-shrink: 0; }
  .conteo-input { width: 98px; text-align: right; padding-right: 36px !important; }
  .conteo-input-unidad { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted); pointer-events: none; }
  .conteo-diff { flex-shrink: 0; width: 82px; text-align: right; font-size: 12px; }
  .conteo-quitar { border: none; background: none; color: #CBD5E1; font-size: 20px; line-height: 1; flex-shrink: 0; cursor: pointer; padding: 4px; }
  .conteo-quitar:hover { color: var(--red); }
  @media (max-width: 640px) {
    .conteo-row { flex-wrap: wrap; }
    .conteo-actual { order: 3; width: auto; }
    .conteo-diff { order: 4; width: auto; }
  }

  /* ---------- Ticket ---------- */
  .ticket { width: 320px; max-width: 100%; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 22px; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); box-shadow: var(--shadow-card); }
  .ticket hr { border: none; border-top: 1px dashed var(--line); margin: 12px 0; }

  .tabs { display: inline-flex; background: var(--line-soft); padding: 4px; border-radius: var(--radius-sm); gap: 2px; }
  .tab-btn { border: none; background: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); }
  .tab-btn.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); font-weight: 700; }

  .gutter { padding-left: 16px; padding-right: 16px; }

  .hint-unico, .hint-falta, .hint-ok { border-radius: var(--radius-sm); padding: 10px 13px; font-size: 12px; font-weight: 500; margin-top: 10px; }
  .hint-unico { background: var(--navy-soft); color: var(--navy-light); }
  .hint-falta { background: var(--ground); color: var(--ink-soft); }
  .hint-ok { background: var(--emerald-soft); color: var(--emerald-dark); font-weight: 600; }
  .qty-quick-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 9px 0; font-weight: 600; font-size: 13px; color: var(--ink-soft); transition: background-color .12s, border-color .12s, color .12s; }
  .qty-quick-btn.active-quick { background: var(--ink); border-color: var(--ink); color: #fff; }
  .qty-round-btn { width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 600; color: var(--ink); }
  .billete-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 9px 0; font-weight: 600; font-size: 12px; color: var(--ink); }
  .pay-method-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 12px 0; font-weight: 600; font-size: 13px; color: var(--ink-soft); text-align:center; transition: background-color .12s, border-color .12s, color .12s; }
  .pay-method-btn.active-pay { border-color: var(--ink); background: var(--ink); color: #fff; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

/* ---------------------------------------------------------------------
 * ALMACENAMIENTO (localStorage) — sin base de datos, todo vive aquí.
 * ------------------------------------------------------------------- */
const LS_PREFIX = 'emili_';
function load(key, fallback) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); }
  catch (e) { /* almacenamiento lleno o no disponible: seguimos sin romper la app */ }
}
function genId(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const ultimoSyncSnapshot = {};

/** Compara el arreglo local contra el último que se sincronizó y sube solo lo que cambió. */
function sincronizarConSupabase(key) {
  if (!SUPABASE_ACTIVO || !sb) return;
  const conv = TABLAS_SUPABASE[key];
  if (!conv || conv.manual) return;
  const idDe = conv.idDe || ((x) => x.id);
  const actual = DB[key] || [];
  const anterior = ultimoSyncSnapshot[key] || [];
  const anterioresPorId = new Map(anterior.map((x) => [idDe(x), x]));
  const actualesPorId = new Map(actual.map((x) => [idDe(x), x]));

  const filasParaGuardar = [];
  actualesPorId.forEach((item, id) => {
    const previo = anterioresPorId.get(id);
    if (!previo || JSON.stringify(previo) !== JSON.stringify(item)) filasParaGuardar.push(conv.aFila(item));
  });
  if (filasParaGuardar.length) {
    encolarEscritura({ tipo: 'upsert', tabla: conv.tabla, filas: filasParaGuardar, conflictCols: conv.conflictCols || ['id'] });
  }
  anterioresPorId.forEach((prevItem, id) => {
    if (!actualesPorId.has(id)) {
      const filaVieja = conv.aFila(prevItem);
      const cols = conv.conflictCols || ['id'];
      encolarEscritura({ tipo: 'borrar', tabla: conv.tabla, filtros: cols.map((c) => [c, filaVieja[c]]) });
    }
  });
  ultimoSyncSnapshot[key] = JSON.parse(JSON.stringify(actual));
}

/* --- Cola de reintento: si no hay internet, las escrituras se guardan y se reintentan solas --- */
const COLA_PENDIENTE_KEY = 'sync_pendientes';
const SYNC_ERRORES_KEY = 'sync_errores';
function colaPendiente() { return load(COLA_PENDIENTE_KEY, []); }
function guardarColaPendiente(cola) { save(COLA_PENDIENTE_KEY, cola); }
function erroresSync() { return load(SYNC_ERRORES_KEY, []); }
/** Guarda un error real del servidor (no de conexión) para poder verlo desde la app, sin necesitar la consola del navegador. */
function registrarErrorSync(op, mensaje) {
  const errores = erroresSync();
  errores.push({ tabla: op.tabla || op.fn || '?', tipo: op.tipo, mensaje: mensaje || 'Error desconocido', fecha: new Date().toISOString() });
  save(SYNC_ERRORES_KEY, errores.slice(-30)); // conserva solo los últimos 30
}

function encolarEscritura(op) {
  if (!SUPABASE_ACTIVO) return;
  const cola = colaPendiente();
  cola.push(op);
  guardarColaPendiente(cola);
  procesarColaPendiente();
}

let procesandoColaPendiente = false;
async function procesarColaPendiente() {
  if (!SUPABASE_ACTIVO || !sb || procesandoColaPendiente) return;
  procesandoColaPendiente = true;
  UI.syncEstado = 'sincronizando';
  try {
    let huboFallo = false;
    while (true) {
      // Siempre se relee la cola desde el almacenamiento justo antes de tomar el primer elemento:
      // mientras esperamos la respuesta de un envío, se pueden haber agregado más (por ejemplo,
      // al subir un Excel con muchos productos de golpe), y no queremos perder esos nuevos.
      const colaActual = colaPendiente();
      if (!colaActual.length) break;
      const op = colaActual[0];
      const resultado = await ejecutarOperacionSupabase(op);
      if (resultado.ok) {
        const colaTrasEsperar = colaPendiente();
        guardarColaPendiente(colaTrasEsperar.slice(1));
        continue;
      }
      huboFallo = true;
      if (resultado.origen === 'red') {
        // Sin internet (o Supabase no responde): no se toca la cola, se reintenta más tarde solo.
        break;
      }
      // El servidor sí respondió pero rechazó la operación (por ejemplo un dato mal formado o un
      // permiso faltante). Se reintenta unas veces por si es pasajero; si insiste, se saca de la
      // cola para no bloquear todo lo que viene detrás, y se guarda el error para poder revisarlo.
      const intentos = (op.intentos || 0) + 1;
      const colaTrasEsperar = colaPendiente();
      const restante = colaTrasEsperar.slice(1);
      if (intentos >= 5) {
        registrarErrorSync(op, resultado.error);
      } else {
        restante.unshift({ ...op, intentos });
      }
      guardarColaPendiente(restante);
    }
    UI.syncEstado = huboFallo ? 'sin_conexion' : 'ok';
  } finally {
    procesandoColaPendiente = false;
    if (UI.session && !hayEntradaActivaDelUsuario()) render();
  }
}

async function ejecutarOperacionSupabase(op) {
  try {
    let resultado;
    if (op.tipo === 'upsert') {
      resultado = await sb.from(op.tabla).upsert(op.filas, { onConflict: op.conflictCols.join(',') });
    } else if (op.tipo === 'borrar') {
      let q = sb.from(op.tabla).delete();
      op.filtros.forEach(([col, val]) => { q = q.eq(col, val); });
      resultado = await q;
    } else if (op.tipo === 'rpc') {
      resultado = await sb.rpc(op.fn, op.args);
    } else {
      return { ok: true };
    }
    if (resultado.error) {
      console.warn('Supabase falló en', op.tabla || op.fn, resultado.error.message);
      return { ok: false, origen: 'servidor', error: resultado.error.message };
    }
    return { ok: true };
  } catch (e) {
    return { ok: false, origen: 'red', error: (e && e.message) || 'Error de red' }; // sin conexión u otro error de red: se reintenta más tarde
  }
}

/* --- Carga inicial desde Supabase + suscripción a cambios de otras sucursales en vivo --- */
async function hidratarDesdeSupabase() {
  if (!SUPABASE_ACTIVO || !sb) return;
  UI.syncEstado = 'sincronizando';
  let huboExito = false;
  for (const [key, conv] of Object.entries(TABLAS_SUPABASE)) {
    try {
      const { data, error } = await sb.from(conv.tabla).select('*');
      if (error || !data) continue;
      const lista = data.map(conv.deFila);
      DB[key] = lista;
      save(key, lista);
      ultimoSyncSnapshot[key] = JSON.parse(JSON.stringify(lista));
      huboExito = true;
    } catch (e) { /* sin conexión: seguimos con lo que ya había guardado localmente */ }
  }
  UI.syncEstado = huboExito ? 'ok' : 'sin_conexion';
  render();
  suscribirCambiosRemotos();
}

function suscribirCambiosRemotos() {
  if (!SUPABASE_ACTIVO || !sb) return;
  Object.entries(TABLAS_SUPABASE).forEach(([key, conv]) => {
    if (conv.sinRealtime) return; // ej. usuarios: se actualiza con el botón "Actualizar" para nunca transmitir el hash de la contraseña
    sb.channel('cambios_' + conv.tabla)
      .on('postgres_changes', { event: '*', schema: 'public', table: conv.tabla }, (payload) => aplicarCambioRemoto(key, conv, payload))
      .subscribe();
  });
}
/** Vuelve a traer el padrón de usuarios desde el servidor (usuarios no se sincroniza en vivo, por seguridad). */
async function h_actualizarUsuarios() {
  if (!SUPABASE_ACTIVO || !sb) return;
  const conv = TABLAS_SUPABASE.usuarios;
  const { data, error } = await sb.from(conv.tabla).select('*');
  if (error || !data) return;
  const lista = data.map(conv.deFila);
  DB.usuarios = lista;
  save('usuarios', lista);
  render();
}

function aplicarCambioRemoto(key, conv, payload) {
  const idDe = conv.idDe || ((x) => x.id);
  const lista = (DB[key] || []).slice();
  if (payload.eventType === 'DELETE') {
    const idBorrado = idDe(conv.deFila(payload.old));
    DB[key] = lista.filter((x) => idDe(x) !== idBorrado);
  } else {
    const item = conv.deFila(payload.new);
    const id = idDe(item);
    const idx = lista.findIndex((x) => idDe(x) === id);
    if (idx >= 0) lista[idx] = item; else lista.push(item);
    DB[key] = lista;
  }
  save(key, DB[key]);
  ultimoSyncSnapshot[key] = JSON.parse(JSON.stringify(DB[key]));
  // Si el usuario está escribiendo en un formulario ahora mismo, no lo interrumpimos:
  // el dato ya quedó guardado arriba y se verá en pantalla en el siguiente refresco
  // (por ejemplo al cerrar el formulario o navegar a otra pantalla).
  if (UI.session && !hayEntradaActivaDelUsuario()) render();
}

const UMBRAL_MAYOREO = 5;

function esPrecioUnico(producto) { return producto.tipo === 'cloro'; }

function litrosParaMayoreo(producto, qty) {
  if (esPrecioUnico(producto)) return 0;
  return Math.max(0, UMBRAL_MAYOREO - qty);
}

/** lineas: [{producto, qty}] → { mayoreoActivo, lineas:[VentaItem], subtotalMenudeo, total, ahorro } */
function calcularCarrito(lineas) {
  const mayoreoActivo = lineas.some((l) => !esPrecioUnico(l.producto) && l.qty >= UMBRAL_MAYOREO);
  let subtotalMenudeo = 0, total = 0;
  const items = lineas.map((l) => {
    const p = l.producto, qty = l.qty;
    const unico = esPrecioUnico(p);
    const esMayoreo = !unico && mayoreoActivo;
    const unitPrice = unico ? p.precioMenudeo : (esMayoreo ? p.precioMayoreo : p.precioMenudeo);
    const lineTotal = Number((unitPrice * qty).toFixed(2));
    subtotalMenudeo += p.precioMenudeo * qty;
    total += lineTotal;
    return { id: p.id, nombre: p.nombre, menudeo: p.precioMenudeo, mayoreo: p.precioMayoreo, tipo: p.tipo, costo: p.costo, qty, unitPrice, lineTotal, esMayoreo };
  });
  subtotalMenudeo = Number(subtotalMenudeo.toFixed(2));
  total = Number(total.toFixed(2));
  const ahorro = Number((subtotalMenudeo - total).toFixed(2));
  return { mayoreoActivo, lineas: items, subtotalMenudeo, total, ahorro };
}

function formatoMoneda(v) {
  return (Number(v) || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2 });
}
function formatoFecha(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function formatoHora(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}
function esMismoMes(iso, ref) {
  ref = ref || new Date(); const d = new Date(iso);
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
}
function esMismoDia(iso, ref) {
  ref = ref || new Date(); const d = new Date(iso);
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
}
function esMismaSemana(iso, ref) {
  ref = ref || new Date();
  const d = new Date(iso);
  const inicio = new Date(ref);
  const diaSemana = (inicio.getDay() + 6) % 7; // lunes=0 ... domingo=6
  inicio.setHours(0, 0, 0, 0);
  inicio.setDate(inicio.getDate() - diaSemana);
  const fin = new Date(inicio);
  fin.setDate(fin.getDate() + 7);
  return d >= inicio && d < fin;
}
function esMismoMesTexto(iso, aaaaMm) {
  if (!aaaaMm) return true;
  const d = new Date(iso);
  const txt = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  return txt === aaaaMm;
}
/* --- Helpers de fecha específicos de Reportes (Ver por: Día / Semana / Mes) --- */
function isoHoy() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isoMesActual() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function lunesDeSemana(d) {
  const dia = (d.getDay() + 6) % 7; // lunes=0 ... domingo=6
  const inicio = new Date(d);
  inicio.setHours(0, 0, 0, 0);
  inicio.setDate(inicio.getDate() - dia);
  return inicio;
}
/** Valor por defecto para <input type="week"> con la semana de hoy, formato AAAA-Www (ISO). */
function isoSemanaActual() {
  const inicio = lunesDeSemana(new Date());
  const jueves = new Date(inicio);
  jueves.setDate(inicio.getDate() + 3);
  const anioIso = jueves.getFullYear();
  const unoEnero = new Date(anioIso, 0, 1);
  const semanaNum = Math.ceil((((jueves - unoEnero) / 86400000) + 1) / 7);
  return anioIso + '-W' + String(semanaNum).padStart(2, '0');
}
/** Convierte "AAAA-Www" (valor de <input type="week">) al Date del lunes de esa semana ISO. */
function fechaDeSemanaISO(aaaaWww) {
  if (!aaaaWww) return null;
  const partes = aaaaWww.split('-W');
  const anio = Number(partes[0]), semana = Number(partes[1]);
  if (!anio || !semana) return null;
  const cuatroEnero = new Date(anio, 0, 4); // el 4 de enero siempre cae en la semana ISO 1
  const lunesSemana1 = lunesDeSemana(cuatroEnero);
  const resultado = new Date(lunesSemana1);
  resultado.setDate(lunesSemana1.getDate() + (semana - 1) * 7);
  return resultado;
}
/** Una venta cuenta como activa (no cancelada) si no tiene estado o su estado no es 'cancelada'. */
function ventaActiva(v) { return v.estado !== 'cancelada'; }
function folioDeVenta(v) {
  const parte = (v.id.split('_')[1] || v.id);
  return '#' + parte.slice(-6).toUpperCase();
}

/** Filtros compartidos (sucursal + Día/Semana/Mes específico, SIN hora) usados en Reportes, Tickets y Utilidad. */
function pasaFiltroSucursal(sucursalId, f) {
  return f.filtroSucursal === 'todas' || sucursalId === f.filtroSucursal;
}
/** Filtro de fecha por modo: Día específico / Semana específica / Mes específico (sin filtro de hora). */
function pasaFiltroFechaModo(fechaIso, f) {
  if (f.modoTiempo === 'dia' && f.fechaDia) {
    if (!esMismoDia(fechaIso, new Date(f.fechaDia + 'T00:00:00'))) return false;
  }
  if (f.modoTiempo === 'semana' && f.fechaSemana) {
    const ref = fechaDeSemanaISO(f.fechaSemana);
    if (ref && !esMismaSemana(fechaIso, ref)) return false;
  }
  if (f.modoTiempo === 'mes' && f.fechaMes) {
    if (!esMismoMesTexto(fechaIso, f.fechaMes)) return false;
  }
  return true;
}
function filtroModoTieneAlgoActivo(f) {
  return f.filtroSucursal !== 'todas' || !!f.modoTiempo || (('busquedaFolio' in f) && !!f.busquedaFolio);
}

/* ---------------------------------------------------------------------
 * INVENTARIO POR SUCURSAL
 * ------------------------------------------------------------------- */
function getStock(sucursalId, productoId) {
  const it = DB.inventario.find((i) => i.sucursalId === sucursalId && i.productoId === productoId);
  return it ? it.stockLitros : 0;
}
function getStockTotal(productoId) {
  return DB.inventario.filter((i) => i.productoId === productoId).reduce((s, i) => s + i.stockLitros, 0);
}
function ajustarStock(sucursalId, productoId, delta) {
  db('inventario', (inv) => {
    const existe = inv.find((i) => i.sucursalId === sucursalId && i.productoId === productoId);
    if (existe) {
      return inv.map((i) => i.id === existe.id ? { ...i, stockLitros: Math.max(0, Number((i.stockLitros + delta).toFixed(2))) } : i);
    }
    return [...inv, { id: genId('inv'), sucursalId, productoId, stockLitros: Math.max(0, Number(delta.toFixed(2))) }];
  });
  // Ajuste local optimista (arriba) + ajuste atómico del lado del servidor cuando hay base compartida,
  // para que dos sucursales vendiendo el mismo producto a la vez no se pisen entre sí.
  sincronizarAjusteStock(sucursalId, productoId, delta);
}
function fijarStock(sucursalId, productoId, valor) {
  db('inventario', (inv) => {
    const existe = inv.find((i) => i.sucursalId === sucursalId && i.productoId === productoId);
    if (existe) return inv.map((i) => i.id === existe.id ? { ...i, stockLitros: Math.max(0, valor) } : i);
    return [...inv, { id: genId('inv'), sucursalId, productoId, stockLitros: Math.max(0, valor) }];
  });
  sincronizarFijarStock(sucursalId, productoId, Math.max(0, valor));
}

async function h_login(e) {
  e.preventDefault();
  const nombre = document.getElementById('login-nombre').value.trim();
  const contrasena = document.getElementById('login-contrasena').value;
  let match = null;

  if (SUPABASE_ACTIVO && sb) {
    // La contraseña nunca se compara en el navegador: el servidor la revisa
    // con su hash y solo regresa los datos seguros del usuario (nunca el hash).
    try {
      const { data, error } = await sb.rpc('verificar_login', { p_nombre: nombre, p_password: contrasena });
      if (error) { UI.loginError = 'No se pudo conectar. Intenta de nuevo.'; render(); return; }
      const fila = data && data[0];
      if (fila) match = { nombre: fila.nombre, rol: fila.rol, sucursalId: fila.sucursal_id };
    } catch (err) {
      UI.loginError = 'Sin conexión con el servidor. Revisa tu internet e intenta de nuevo.';
      render();
      return;
    }
  } else {
    match = DB.usuarios.find((u) => u.nombre.trim().toLowerCase() === nombre.toLowerCase() && u.contrasena === contrasena) || null;
  }

  if (!match) {
    UI.loginError = 'Usuario o contraseña incorrectos.';
    render();
    return;
  }
  UI.loginError = '';
  UI.session = { role: match.rol, nombre: match.nombre, loginAt: new Date().toISOString() };
  save('session', UI.session);
  if (match.sucursalId && DB.sucursales.some((s) => s.id === match.sucursalId)) {
    UI.sucursalActualId = match.sucursalId;
    save('sucursal_actual', match.sucursalId);
  }
  UI.view = match.rol === 'OWNER' ? 'dashboard' : 'venta';
  render();
}

          ${p.foto ? `<img src="${p.foto}" style="width:26px;height:26px;border-radius:7px;object-fit:cover;flex-shrink:0;" alt="">` : `<span style="font-size:18px;flex-shrink:0;">${TIPO_ICON[p.tipo]}</span>`}

function h_cerrarCarritoMovil() { UI.venta.carritoMovilOpen = false; refreshModalRoot(); }
function renderCarritoMovilModal() {

    <div style="display:flex;flex-direction:column;max-height:80vh;">

function productosCoincidentes(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return [];
  return DB.productos.filter((p) => p.nombre.toLowerCase().includes(q));
}

function renderVentaGrid() {
  const suc = sucursalActual();
  const q = UI.venta.busqueda.toLowerCase();
  const list = DB.productos.filter((p) => p.nombre.toLowerCase().includes(q));
  if (list.length === 0) return `<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;">No se encontraron productos.</p>`;
  return list.map((p) => renderProductCard(p, suc)).join('');
}

function renderVentaDropdown() {
  if (!UI.venta.dropdownVisible) return '';
  const q = UI.venta.busqueda.trim();
  if (!q) return '';
  const suc = sucursalActual();
  const list = productosCoincidentes(q).slice(0, 8);
  if (!list.length) {
    return `<div class="search-dropdown"><div class="search-dropdown-empty">Sin resultados para "${escapeHtml(q)}"</div></div>`;
  }
  return `<div class="search-dropdown">
    ${list.map((p) => {
      const stock = suc ? getStock(suc.id, p.id) : 0;
      const sinStock = stock <= 0;
      const unico = esPrecioUnico(p);
      const precioTxt = unico ? `${formatoMoneda(p.precioMenudeo)} /L · único` : `${formatoMoneda(p.precioMenudeo)} /L menudeo`;
      return `<div class="search-dropdown-item ${sinStock ? 'dd-disabled' : ''}" ${sinStock ? '' : `onmousedown="event.preventDefault(); h_abrirQty('${p.id}')"`}>
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${p.foto ? `<img src="${p.foto}" style="width:28px;height:28px;border-radius:8px;object-fit:cover;flex-shrink:0;" alt="">` : `<span style="font-size:17px;flex-shrink:0;">${TIPO_ICON[p.tipo]}</span>`}
          <div style="min-width:0;">
            <p style="font-weight:700;color:var(--navy);font-size:13px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(p.nombre)}</p>
            <p style="font-size:11px;color:var(--muted);margin:0;">${precioTxt}</p>
          </div>
        </div>
        <span class="badge ${sinStock ? 'badge-red' : (stock < 10 ? 'badge-red' : 'badge-emerald')}" style="flex-shrink:0;">${sinStock ? 'Sin stock' : stock + (p.piezas ? ' pzas' : ' L')}</span>
      </div>`;
    }).join('')}
  </div>`;
}

function renderProductCard(p, suc) {
  const stock = suc ? getStock(suc.id, p.id) : 0;
  const stockBajo = stock < 10;
  const unico = esPrecioUnico(p);
  const sinStock = stock <= 0;
  const owner = efectivoRol() === 'OWNER';
  return `
    <button class="prod-card" ${sinStock ? 'disabled' : ''} data-action="abrirQty" data-id="${p.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        ${p.foto ? `<img src="${p.foto}" class="prod-photo" alt="">` : `<span style="font-size:22px;">${TIPO_ICON[p.tipo]}</span>`}
        <span class="badge ${stockBajo ? 'badge-red' : 'badge-gray'}">${stock} ${p.piezas ? 'pzas' : 'L'}</span>
      </div>
      <p class="prod-name">${escapeHtml(p.nombre)}</p>
      <div style="margin-top:7px;">
        ${unico
          ? `<p style="font-weight:700;font-size:13px;">${formatoMoneda(p.precioMenudeo)} <span style="color:var(--muted);font-weight:500;font-size:11px;">/L · único</span></p>`
          : `<p style="font-weight:700;font-size:13px;">${formatoMoneda(p.precioMenudeo)}<span style="color:var(--muted);font-weight:500;font-size:11px;"> /L menudeo</span></p>
             <p style="font-weight:700;font-size:11.5px;color:var(--emerald-dark);margin-top:1px;">${formatoMoneda(p.precioMayoreo)} /L mayoreo (5+ L)</p>`}
        ${owner ? `<p style="font-size:10.5px;color:var(--muted);margin-top:3px;">Costo: ${formatoMoneda(p.costo)}</p>` : ''}
      </div>
      ${sinStock ? `<p style="font-size:10.5px;font-weight:700;color:var(--red);margin-top:6px;">Sin stock</p>` : ''}
    </button>
  `;
}

function h_ventaBusquedaKey(e) {
  if (e.key === 'Escape') {
    e.target.blur();
    return;
  }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const suc = sucursalActual();
  const match = productosCoincidentes(UI.venta.busqueda).find((p) => !suc || getStock(suc.id, p.id) > 0);
  if (match) h_abrirQty(match.id);
}

function clampQty(qty, max) {
  qty = Number(qty) || 0;
  max = Math.max(max, 0);
  return Math.min(Math.max(qty, 0.5), Math.max(max, 0.5));
}

function h_qtyInput(v) {
  const p = DB.productos.find((x) => x.id === UI.venta.modalProducto);
  const suc = sucursalActual();
  const max = suc ? getStock(suc.id, p.id) : 0;
  UI.venta.modalQty = clampQty(v, max);
  syncQtyModal(false);
}
function h_qtyStep(delta) {
  const p = DB.productos.find((x) => x.id === UI.venta.modalProducto);
  const suc = sucursalActual();
  const max = suc ? getStock(suc.id, p.id) : 0;
  UI.venta.modalQty = clampQty(UI.venta.modalQty + Number(delta), max);
  syncQtyModal(true);
}
function h_qtyQuick(v) {
  const p = DB.productos.find((x) => x.id === UI.venta.modalProducto);
  const suc = sucursalActual();
  const max = suc ? getStock(suc.id, p.id) : 0;
  UI.venta.modalQty = clampQty(v, max);
  syncQtyModal(true);
}
function syncQtyModal(updateInputValue) {
  const p = DB.productos.find((x) => x.id === UI.venta.modalProducto);
  if (!p) return;
  const qty = UI.venta.modalQty;
  const unico = esPrecioUnico(p);
  const faltan = litrosParaMayoreo(p, qty);
  const hint = document.getElementById('qty-hint');
  if (hint) {
    hint.className = unico ? 'hint-unico' : (faltan > 0 ? 'hint-falta' : 'hint-ok');
    hint.innerHTML = unico
      ? `Precio único: ${formatoMoneda(p.precioMenudeo)} /L. No activa mayoreo.`
      : faltan > 0
        ? `Te faltan <b>${faltan} L</b> de este producto para activar el precio de mayoreo (${formatoMoneda(p.precioMayoreo)} /L) en toda la venta.`
        : `⚡ ¡Con ${qty} L activas precio de MAYOREO en toda la venta!`;
  }
  if (updateInputValue) {
    const input = document.getElementById('qty-input');
    if (input) input.value = qty;
  }
  document.querySelectorAll('.qty-quick-btn').forEach((b) => {
    b.classList.toggle('active-quick', Number(b.getAttribute('data-arg')) === qty);
  });
}

function h_agregarCarrito() {
  const productoId = UI.venta.modalProducto;
  const qty = UI.venta.modalQty;
  if (!productoId || qty <= 0) return;
  const existente = UI.venta.carrito.find((l) => l.productoId === productoId);
  if (existente) existente.qty += qty;
  else UI.venta.carrito.push({ productoId, qty });
  UI.venta.modalProducto = null;
  render();
}
function h_quitarDelCarrito(id) {
  UI.venta.carrito = UI.venta.carrito.filter((l) => l.productoId !== id);

}

function h_confirmarCobro() {
  const suc = sucursalActual();
  if (!suc || !UI.session) return;
  const c = ventaComputo();
  const metodo = UI.venta.pagoMetodo;
  const recibido = UI.venta.pagoRecibido || 0;
  if (metodo === 'efectivo' && recibido < c.total) return;

  const venta = {
    id: genId('venta'), fecha: new Date().toISOString(), sucursalId: suc.id, sucursalNombre: suc.nombre,
    items: c.lineas, subtotalMenudeo: c.subtotalMenudeo, ahorro: c.ahorro, total: c.total,
    payMethod: metodo, recibido: metodo === 'efectivo' ? recibido : undefined, cambio: metodo === 'efectivo' ? Number((recibido - c.total).toFixed(2)) : undefined,
    clienteId: (UI.venta.clienteAsignado || {}).id, clienteNombre: (UI.venta.clienteAsignado || {}).nombre || 'Publico General',
    mayoreo: c.mayoreoActivo, vendedor: UI.session.nombre, estado: 'completada',
  };
  db('ventas', (v) => [venta, ...v]);
  c.lineas.forEach((l) => ajustarStock(suc.id, l.id, -l.qty));
  if (UI.venta.clienteAsignado) {
    const clienteId = UI.venta.clienteAsignado.id;
    db('clientes', (cs) => cs.map((cl) => cl.id === clienteId ? { ...cl, compras: cl.compras + 1, totalGastado: Number((cl.totalGastado + venta.total).toFixed(2)) } : cl));
  }
  UI.venta.showPago = false;
  UI.venta.carritoMovilOpen = false;
  UI.venta.ventaFinalizada = venta;
  render();
}

function h_nuevaVenta() {
  UI.venta.carrito = [];
  UI.venta.clienteAsignado = null;
  UI.venta.ventaFinalizada = null;
  UI.venta.carritoMovilOpen = false;
  render();
}

/* ---------------------------------------------------------------------
 * MODAL ROOT — centraliza qué modal (si alguno) está abierto
 * ------------------------------------------------------------------- */
function refreshModalRoot() {
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = renderModalRoot();
}
function modalWrap(innerHtml, maxWidth) {
  return `<div class="modal-scrim" onclick="if (event.target === event.currentTarget) h_cerrarModal()"><div class="modal-box" style="max-width:${maxWidth || '420px'};">${innerHtml}</div></div>`;
}
function renderModalRoot() {
  if (UI.venta.modalProducto) return renderQtyModal();
  if (UI.venta.showCliente) return renderClienteModal();
  if (UI.venta.showPago) return renderPagoModal();
  if (UI.venta.showCorte) return renderCorteModal();
  if (UI.productos.formOpen) return renderProductoFormModal();
  if (UI.productos.familiasModalOpen) return renderFamiliasModal();
  if (UI.productos.inv.showAgregar) return renderAgregarMaterialModal();
  if (UI.clientes.formOpen) return renderClienteFormModal();
  if (UI.gastos.formOpen) return renderGastoFormModal();
  if (UI.usuarios.formUsuarioOpen) return renderUsuarioFormModal();
  if (UI.usuarios.formSucursalOpen) return renderSucursalFormModal();
  if (UI.tickets.editando) return renderTicketEditModal();
  if (UI.tickets.detalleId) return renderTicketDetalleModal();
  if (UI.syncErroresOpen) return renderErroresSyncModal();
  if (UI.venta.carritoMovilOpen) return renderCarritoMovilModal();
  if (UI.productos.inv.importModoOpen) return renderImportModoModal();
  return '';
}

function renderQtyModal() {
  const p = DB.productos.find((x) => x.id === UI.venta.modalProducto);
  if (!p) return '';
  const suc = sucursalActual();
  const max = suc ? getStock(suc.id, p.id) : 0;
  const qty = UI.venta.modalQty || 1;
  const unico = esPrecioUnico(p);
  const faltan = litrosParaMayoreo(p, qty);
  const hintClass = unico ? 'hint-unico' : (faltan > 0 ? 'hint-falta' : 'hint-ok');
  const hintText = unico
    ? `Precio único: ${formatoMoneda(p.precioMenudeo)} /L. No activa mayoreo.`
    : faltan > 0
      ? `Te faltan <b>${faltan} L</b> de este producto para activar el precio de mayoreo (${formatoMoneda(p.precioMayoreo)} /L) en toda la venta.`
      : `⚡ ¡Con ${qty} L activas precio de MAYOREO en toda la venta!`;
  const quick = [1, 3, 5, 10];
  return modalWrap(`
    <div class="modal-pad">
      <p class="field-label">${escapeHtml(p.nombre)}</p>
      <h3 style="margin-top:4px;">¿Cuántos litros?</h3>
      <p id="qty-hint" class="${hintClass}">${hintText}</p>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;">

        <button class="qty-round-btn" data-action="qtyStep" data-arg="1">+</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;">
        ${quick.map((v) => `<button class="qty-quick-btn ${v === qty ? 'active-quick' : ''}" data-arg="${v}" onclick="h_qtyQuick(${v})">${v} L</button>`).join('')}
      </div>
      <p style="text-align:center;color:var(--muted);font-size:11.5px;margin-top:12px;">Stock disponible: ${max} ${p.piezas ? 'pzas' : 'L'}</p>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button class="btn btn-ghost" style="flex:1;" data-action="cerrarModal">Cancelar</button>
        <button class="btn btn-accent" style="flex:1;" data-action="agregarCarrito">Agregar al carrito</button>

function renderCorteModal() {
  const suc = sucursalActual();
  const vend = UI.session.nombre;
  const hoy = DB.ventas.filter((v) => esMismoDia(v.fecha) && suc && v.sucursalId === suc.id && v.vendedor === vend && ventaActiva(v));
  const total = hoy.reduce((s, v) => s + v.total, 0);

  hoy.forEach((v) => { porMetodo[v.payMethod] += v.total; });
  return modalWrap(`

function h_nuevaFamilia() {
  const nombre = (prompt('Nombre de la nueva familia (ej. Automotriz):') || '').trim();
  if (!nombre) return;
  if (DB.familias.some((f) => f.toLowerCase() === nombre.toLowerCase())) {
    alert('Esa familia ya existe.');
    return;
  }
  db('familias', (list) => [...list, nombre]);
  const select = document.getElementById('pf-familia');
  if (select) {
    const opt = document.createElement('option');
    opt.value = nombre;
    opt.textContent = nombre;
    select.appendChild(opt);
    select.value = nombre;
  }
}

function h_borrarFamilia(nombre) {
  if (!puedeBorrar()) return;
  if (nombre === 'Otros') { alert('La familia "Otros" no se puede borrar — es la que se usa por defecto.'); return; }
  const enUso = DB.productos.filter((p) => familiaDe(p) === nombre).length;
  const mensaje = enUso > 0
    ? `"${nombre}" tiene ${enUso} producto(s) asignado(s). Si la borras, esos productos pasarán a la familia "Otros". ¿Continuar?`
    : `¿Borrar la familia "${nombre}"?`;
  if (!confirm(mensaje)) return;
  if (enUso > 0) {
    db('productos', (list) => list.map((p) => (familiaDe(p) === nombre ? { ...p, familia: 'Otros' } : p)));
  }
  db('familias', (list) => list.filter((f) => f !== nombre));
  refreshModalRoot();
}

function h_fotoProducto(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    UI.productos.fotoTmp = reader.result; // vista previa instantánea, siempre local primero
    const preview = document.getElementById('foto-preview');
    if (preview) preview.innerHTML = `<img src="${reader.result}" style="width:100%;height:100%;object-fit:cover;">`;
    if (SUPABASE_ACTIVO && sb) {
      // Sube la foto a un almacenamiento de archivos y guarda solo la URL (liviana)
      // en vez de todo el archivo en base64 dentro de la fila del producto.
      try {
        const ruta = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
        const { error } = await sb.storage.from('productos').upload(ruta, file, { upsert: true });
        if (!error) {
          const { data } = sb.storage.from('productos').getPublicUrl(ruta);
          if (data && data.publicUrl) UI.productos.fotoTmp = data.publicUrl;
        }
      } catch (e) { /* sin conexión: se guarda con la foto en base64 local, sin bloquear al usuario */ }
    }
  };
  reader.readAsDataURL(file);
}
function h_guardarProducto() {
  const nombre = document.getElementById('pf-nombre').value.trim();
  if (!nombre) return;
  const owner = efectivoRol() === 'OWNER';
  const editando = UI.productos.editando;
  const producto = {
    id: editando ? editando.id : genId('prod'),
    nombre,
    foto: UI.productos.fotoTmp !== undefined && UI.productos.fotoTmp !== null ? UI.productos.fotoTmp : (editando ? editando.foto : null),
    tipo: editando ? editando.tipo : 'otros',
    familia: (document.getElementById('pf-familia').value || 'Otros').trim(),
    precioMenudeo: Number(document.getElementById('pf-menudeo').value) || 0,
    precioMayoreo: Number(document.getElementById('pf-mayoreo').value) || 0,
    costo: owner ? (Number(document.getElementById('pf-costo').value) || 0) : (editando ? editando.costo : 0),
    piezas: document.getElementById('pf-piezas').value ? Number(document.getElementById('pf-piezas').value) : undefined,

  });

  render();

function h_exportarCatalogo() {
  if (efectivoRol() !== 'OWNER') return; // los precios de compra (costo) son solo del Dueño
  const rows = DB.productos.map((p) => ({ nombre: p.nombre, precioMenudeo: p.precioMenudeo, precioMayoreo: p.precioMayoreo, costo: p.costo, tipo: p.tipo, familia: familiaDe(p), piezas: p.piezas || '' }));
  const ws = XLSX.utils.json_to_sheet(rows, { header: ['nombre', 'precioMenudeo', 'precioMayoreo', 'costo', 'tipo', 'familia', 'piezas'] });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Catalogo');
  XLSX.writeFile(wb, 'catalogo_emilimpio.xlsx');
}
function h_importarCatalogo(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const wb = XLSX.read(reader.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      const tiposValidos = ['detergente', 'suavizante', 'cloro', 'otros'];
      const familiasNuevas = [];
      let n = 0;
      db('productos', (list) => {
        const copia = [...list];
        rows.filter((r) => String(r.nombre || '').trim()).forEach((r) => {
          const tipoRaw = String(r.tipo || 'otros').toLowerCase().trim();
          const familiaRaw = String(r.familia || 'Otros').trim();
          if (familiaRaw && !DB.familias.includes(familiaRaw) && !familiasNuevas.includes(familiaRaw)) familiasNuevas.push(familiaRaw);
          const nuevo = {
            id: genId('prod'), nombre: String(r.nombre).trim(),
            precioMenudeo: Number(r.precioMenudeo) || 0, precioMayoreo: Number(r.precioMayoreo) || 0, costo: Number(r.costo) || 0,
            tipo: tiposValidos.includes(tipoRaw) ? tipoRaw : 'otros',
            familia: familiaRaw || 'Otros',
            piezas: r.piezas !== '' && r.piezas !== undefined ? Number(r.piezas) : undefined,
          };
          const idx = copia.findIndex((p) => p.nombre.toLowerCase() === nuevo.nombre.toLowerCase());
          if (idx >= 0) copia[idx] = { ...nuevo, id: copia[idx].id, foto: copia[idx].foto };
          else copia.push(nuevo);
          n++;
        });
        return copia;
      });
      if (familiasNuevas.length) db('familias', (list) => [...list, ...familiasNuevas]);
      UI.productos.mensaje = 'Se importaron ' + n + ' productos correctamente.';
    } catch (e) { UI.productos.mensaje = 'No se pudo leer el archivo. Verifica el formato.'; }
    render();
    setTimeout(() => { UI.productos.mensaje = ''; render(); }, 4000);
  };
  reader.readAsArrayBuffer(file);
}

/* ---------------------------------------------------------------------
 * CONTEO FÍSICO
 * Muestra, producto por producto, lo que el sistema espera tener contra
 * lo que en verdad se contó a mano, con la diferencia (balance) al vuelo.
 * Al aplicar, cada producto capturado se FIJA (no se suma) a la cantidad
 * contada — es una reconciliación, no un ajuste. Si se marca "es el
 * inventario inicial", los productos que se dejaron en blanco arrancan
 * en 0 (se asume que de verdad no había nada de eso); si no, los que se
 * dejan en blanco simplemente no se tocan.
 * ------------------------------------------------------------------- */
function h_abrirConteo() {
  UI.productos.inv.conteoActivo = true;
  UI.productos.inv.conteoValores = {};
  UI.productos.inv.conteoExcluidos = {};

function h_cerrarConteo() {

  if (cont) cont.innerHTML = renderInventarioTab();
}
function renderConteoFisico(sucId, suc) {
  const inv = UI.productos.inv;
  const productos = DB.productos.filter((p) => !inv.conteoExcluidos[p.id]);
  return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <div>
        <h3 style="margin:0;">📋 Conteo físico — ${escapeHtml(suc.nombre)}</h3>
        <p style="color:var(--muted);font-size:12.5px;margin:3px 0 0;max-width:480px;">A la izquierda ves lo que el sistema espera tener; captura a la derecha lo que de verdad contaste y aquí mismo verás el balance (la diferencia).</p>
      </div>
      <button class="btn btn-ghost" data-action="cerrarConteo">✕ Cancelar conteo</button>
    </div>
    <div class="card" style="padding:4px 16px;margin-bottom:16px;">
      ${productos.map((p) => {
        const esperado = getStock(sucId, p.id);
        const unidad = p.piezas ? 'pzas' : 'L';
        const valorTxt = inv.conteoValores[p.id];
        return `
        <div class="conteo-row" id="conteo-row-${p.id}">
          <div class="conteo-info">
            <p class="conteo-nombre">${escapeHtml(p.nombre)}</p>
            <p class="conteo-sub">${escapeHtml(familiaDe(p))}</p>
          </div>
          <span class="conteo-actual">${esperado} ${unidad}</span>
          <div class="conteo-input-wrap">
            <input type="number" min="0" step="0.5" class="input conteo-input" placeholder="0"
              value="${valorTxt == null ? '' : escapeHtml(String(valorTxt))}"
              oninput="h_conteoInput('${p.id}', this.value)">
            <span class="conteo-input-unidad">${unidad}</span>
          </div>
          <span class="conteo-diff" id="conteo-diff-${p.id}">${renderConteoDiff(p.id, sucId)}</span>
          <button class="conteo-quitar" data-action="conteoQuitarFila" data-id="${p.id}" title="Quitar de este conteo">—</button>
        </div>`;
      }).join('') || `<p class="empty-row">Primero agrega productos en la pestaña Productos.</p>`}
    </div>
    <label style="display:flex;align-items:center;gap:9px;cursor:pointer;">
      <input type="checkbox" style="width:17px;height:17px;flex-shrink:0;" ${inv.conteoEsInicial ? 'checked' : ''} onchange="h_conteoToggleInicial(this.checked)">
      <span style="font-size:13px;color:var(--ink);">Es el inventario inicial (arranque del sistema) <span style="font-weight:400;color:var(--muted);">— lo que dejes en blanco arranca en 0</span></span>
    </label>
    <div style="display:flex;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-primary" data-action="aplicarConteo">✅ Aplicar conteo</button>
    </div>
  `;
}
function renderConteoDiff(productoId, sucId) {
  const valorTxt = UI.productos.inv.conteoValores[productoId];
  if (valorTxt == null || String(valorTxt).trim() === '') return '';
  const valor = Number(String(valorTxt).trim().replace(',', '.'));
  if (isNaN(valor)) return '';
  const diff = Number((valor - getStock(sucId, productoId)).toFixed(2));
  if (diff === 0) return `<span style="color:var(--muted);">sin diferencia</span>`;
  return `<span style="color:${diff > 0 ? 'var(--emerald-dark)' : 'var(--red)'};font-weight:700;">${diff > 0 ? '+' : ''}${diff}</span>`;
}
function h_conteoInput(productoId, value) {
  UI.productos.inv.conteoValores[productoId] = value;
  const diff = document.getElementById('conteo-diff-' + productoId);
  if (diff) diff.innerHTML = renderConteoDiff(productoId, UI.productos.inv.sucursalId);
}
function h_conteoQuitarFila(productoId) {
  UI.productos.inv.conteoExcluidos[productoId] = true;
  delete UI.productos.inv.conteoValores[productoId];
  const row = document.getElementById('conteo-row-' + productoId);
  if (row) row.remove();
}
function h_conteoToggleInicial(checked) {
  UI.productos.inv.conteoEsInicial = !!checked;
}
function h_aplicarConteo() {
  const inv = UI.productos.inv;
  const sucId = inv.sucursalId;
  const productos = DB.productos.filter((p) => !inv.conteoExcluidos[p.id]);
  let aplicados = 0;
  productos.forEach((p) => {
    const valorTxt = inv.conteoValores[p.id];
    const tieneValor = valorTxt != null && String(valorTxt).trim() !== '';
    const valor = tieneValor ? Number(String(valorTxt).trim().replace(',', '.')) : NaN;
    if (tieneValor && !isNaN(valor)) {
      fijarStock(sucId, p.id, Math.max(0, valor));
      aplicados++;
    } else if (inv.conteoEsInicial) {
      // En un conteo de arranque, lo que se deja en blanco se asume en 0 (no se tenía nada de eso).
      fijarStock(sucId, p.id, 0);
      aplicados++;
    }
  });
  const suc = DB.sucursales.find((s) => s.id === sucId);
  const nombreSuc = suc ? suc.nombre : '';
  inv.mensaje = (inv.conteoEsInicial
    ? 'Se guardó como el inventario inicial de ' + nombreSuc + ': '
    : 'Se aplicó el conteo físico de ' + nombreSuc + ': ') + aplicados + ' de ' + productos.length + ' productos actualizados.';
  inv.conteoActivo = false;
  inv.conteoValores = {};
  inv.conteoExcluidos = {};
  inv.conteoEsInicial = false;
  render();
  setTimeout(() => { UI.productos.inv.mensaje = ''; render(); }, 9000);
}

function h_agregarMaterialALista() {
  const productoId = UI.productos.inv.productoSeleccionado;
  const cantidad = Number(document.getElementById('am-cantidad').value);
  if (!productoId) {
    const input = document.getElementById('am-busqueda');
    if (input) { input.focus(); input.style.borderColor = 'var(--red)'; setTimeout(() => { input.style.borderColor = ''; }, 900); }
    return;
  }
  if (!cantidad || cantidad <= 0) return;
  const carrito = UI.productos.inv.carrito;
  const existe = carrito.find((i) => i.productoId === productoId);
  if (existe) {
    existe.cantidad = Number((existe.cantidad + cantidad).toFixed(2));
  } else {
    carrito.push({ productoId, cantidad: Number(cantidad.toFixed(2)) });
  }
  UI.productos.inv.ultimoProductoId = productoId;
  // Limpia la búsqueda para poder añadir el siguiente producto rápido
  UI.productos.inv.busquedaProducto = '';
  UI.productos.inv.productoSeleccionado = null;
  refreshModalRoot();
  const input = document.getElementById('am-busqueda');
  if (input) input.focus();

function h_exportarInventario() {
  const suc = DB.sucursales.find((s) => s.id === UI.productos.inv.sucursalId);
  if (!suc) return;
  const rows = DB.productos.map((p) => ({ nombre: p.nombre, stock: getStock(suc.id, p.id) }));
  const ws = XLSX.utils.json_to_sheet(rows, { header: ['nombre', 'stock'] });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  XLSX.writeFile(wb, 'inventario_' + suc.nombre.replace(/\s+/g, '_').toLowerCase() + '.xlsx');
}
/** Convierte las llaves de una fila del Excel a minúsculas y sin espacios, para que no importe
 *  si el encabezado dice "Nombre", "NOMBRE" o "nombre " — todas se leen igual. */
function normalizarFilaExcel(r) {
  const out = {};
  Object.keys(r).forEach((k) => { out[String(k).trim().toLowerCase()] = r[k]; });
  return out;
}
function h_importarInventario(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const wb = XLSX.read(reader.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' }).map(normalizarFilaExcel);
      const filasValidas = [];
      const noEncontrados = [];
      const sinCantidad = [];
      rows.filter((r) => String(r.nombre || '').trim()).forEach((r) => {
        const nombreFila = String(r.nombre).trim();
        const producto = DB.productos.find((p) => p.nombre.toLowerCase() === nombreFila.toLowerCase());
        if (!producto) { noEncontrados.push(nombreFila); return; }
        const valorTexto = String(r.stock == null ? '' : r.stock).trim().replace(',', '.');
        const valor = Number(valorTexto);
        // Si la celda de cantidad viene vacía o con algo que no es un número, NO tocamos el stock
        // de ese producto (mejor dejarlo como estaba que ponerlo en 0 por error).
        if (valorTexto === '' || isNaN(valor)) { sinCantidad.push(nombreFila); return; }
        filasValidas.push({ productoId: producto.id, valor });
      });
      // No se aplica todavía: primero se le pregunta al usuario si quiere sustituir el stock
      // actual por el del archivo, o sumarlo a lo que ya hay (ver h_confirmarImportModo).
      UI.productos.inv.importPendiente = { filasValidas, noEncontrados, sinCantidad, totalFilas: rows.length };
      UI.productos.inv.importModoOpen = true;
      refreshModalRoot();
    } catch (e) {
      UI.productos.inv.mensaje = 'No se pudo leer el archivo. Verifica el formato.';
      render();
      setTimeout(() => { UI.productos.inv.mensaje = ''; render(); }, 6000);
    }
  };
  reader.readAsArrayBuffer(file);
}
function h_cerrarImportModo() {
  UI.productos.inv.importModoOpen = false;
  UI.productos.inv.importPendiente = null;
  refreshModalRoot();
}
function h_confirmarImportModo(id, modo) {
  const pend = UI.productos.inv.importPendiente;
  if (!pend) return;
  const sucId = UI.productos.inv.sucursalId;
  pend.filasValidas.forEach(({ productoId, valor }) => {
    if (modo === 'sumar') ajustarStock(sucId, productoId, valor);
    else fijarStock(sucId, productoId, valor);
  });
  let msg = (modo === 'sumar' ? 'Se sumó' : 'Se sustituyó') + ' el stock de ' + pend.filasValidas.length + ' de ' + pend.totalFilas + ' productos del archivo.';
  if (pend.noEncontrados.length) msg += ' No se encontraron ' + pend.noEncontrados.length + ' (revisa que el nombre sea idéntico al del catálogo): ' + pend.noEncontrados.slice(0, 5).join(', ') + (pend.noEncontrados.length > 5 ? '…' : '') + '.';
  if (pend.sinCantidad.length) msg += ' ' + pend.sinCantidad.length + ' no tenían una cantidad válida y se dejaron sin cambios.';
  UI.productos.inv.mensaje = msg;
  UI.productos.inv.importModoOpen = false;
  UI.productos.inv.importPendiente = null;
  render();
  setTimeout(() => { UI.productos.inv.mensaje = ''; render(); }, 9000);
}

function renderReportesBody() {
  const f = UI.reportes;
  const sucNombre = f.filtroSucursal === 'todas' ? 'todas las sucursales' : (DB.sucursales.find((s) => s.id === f.filtroSucursal) || {}).nombre || '—';
  const ventasFiltradas = DB.ventas.filter((v) => ventaActiva(v) && pasaFiltroSucursal(v.sucursalId, f) && pasaFiltroFechaModo(v.fecha, f));

  const porProducto = {};
  DB.productos.forEach((p) => { porProducto[p.id] = { nombre: p.nombre, litros: 0, ingresos: 0, ventasCount: 0 }; });
  let totalVentas = 0;
  let unidadesVendidas = 0;
  ventasFiltradas.forEach((v) => {
    totalVentas += v.total;
    v.items.forEach((it) => {
      if (!porProducto[it.id]) porProducto[it.id] = { nombre: it.nombre, litros: 0, ingresos: 0, ventasCount: 0 };
      porProducto[it.id].litros += it.qty;
      porProducto[it.id].ingresos += it.lineTotal;
      porProducto[it.id].ventasCount += 1;
      unidadesVendidas += it.qty;

  const stockDe = (productoId) => f.filtroSucursal === 'todas' ? getStockTotal(productoId) : getStock(f.filtroSucursal, productoId);

  // Comparativa de productos: top 5 más y menos vendidos (solo productos con al menos 1 venta en el periodo)

  const masVendidos = [...filasConVentas].sort((a, b) => b.litros - a.litros).slice(0, 5);
  const menosVendidos = [...filasConVentas].sort((a, b) => a.litros - b.litros).slice(0, 5);

  // Comparativa de productos, agrupada por Familia: cuánto vendió cada familia en $ y litros
  const porFamilia = {};

    v.items.forEach((it) => {

      const familia = familiaDe(producto);
      if (!porFamilia[familia]) porFamilia[familia] = { familia, litros: 0, ingresos: 0 };
      porFamilia[familia].litros += it.qty;
      porFamilia[familia].ingresos += it.lineTotal;

    return { sucursal: s, monto, litros };

      <div class="kpi"><div class="kpi-label">Stock bajo</div><div class="kpi-value" style="color:var(--red);">${stockBajoCount}</div><div class="kpi-sub">productos con menos de 10 en ${escapeHtml(sucNombre)}</div></div>
    </div>
    <div class="table-wrap"><table class="dtable">
      <thead><tr><th>Producto</th><th>Vendido (periodo filtrado)</th><th>Nº de ventas</th><th>Stock (${escapeHtml(sucNombre)})</th></tr></thead>
      <tbody>
        ${filas.map((fila) => {
          const producto = DB.productos.find((p) => p.id === fila.id);
          return `
          <tr>
            <td style="font-weight:700;color:var(--navy);">${escapeHtml(fila.nombre)}</td>
            <td>${fila.litros.toFixed(1)} ${producto && producto.piezas ? 'pzas' : 'L'}</td>
            <td>${fila.ventasCount}</td>
            <td>${producto ? (() => {
              const stockTotal = stockDe(producto.id);
              return `<span class="badge ${stockTotal < 10 ? 'badge-red' : 'badge-emerald'}">${stockTotal} ${producto.piezas ? 'pzas' : 'L'}</span>`;
            })() : '<span class="badge badge-gray">producto eliminado</span>'}</td>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px;">
      <div class="card" style="padding:18px;">
        <h3 style="margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--emerald-dark);">🔥 Top 5 más vendidos</h3>
        <div class="table-wrap"><table class="dtable" style="font-size:12px;">
          <thead><tr><th>Producto</th><th>Litros</th><th>Dinero</th></tr></thead>
          <tbody>
            ${masVendidos.map((fila) => `
              <tr>
                <td style="font-weight:700;color:var(--navy);">${escapeHtml(fila.nombre)}</td>

        <div class="table-wrap"><table class="dtable" style="font-size:12px;">
          <thead><tr><th>Producto</th><th>Litros</th><th>Dinero</th></tr></thead>
          <tbody>
            ${menosVendidos.map((fila) => `

/* ---------------------------------------------------------------------
 * UTILIDADES POR SUCURSAL (Owner)
 * ------------------------------------------------------------------- */
function costoDeVenta(v) { return v.items.reduce((si, it) => si + it.costo * it.qty, 0); }

function calcularUtilidad(ventasSet, gastosSet) {
  const ventasTotales = ventasSet.reduce((s, v) => s + v.total, 0);
  const costoTotal = ventasSet.reduce((s, v) => s + costoDeVenta(v), 0);
  const gastosTotal = gastosSet.reduce((s, g) => s + g.monto, 0);

  const utilidadNeta = ventasTotales - costoTotal - gastosTotal;
  const margenBruto = ventasTotales > 0 ? ((ventasTotales - costoTotal) / ventasTotales) * 100 : 0;
  const margenNeto = ventasTotales > 0 ? (utilidadNeta / ventasTotales) * 100 : 0;

  const porProducto = {};
  ventasSet.forEach((v) => {
    v.items.forEach((it) => {
      if (!porProducto[it.id]) porProducto[it.id] = { nombre: it.nombre, costo: it.costo, ingresos: 0, litros: 0 };
      porProducto[it.id].ingresos += it.lineTotal;
      porProducto[it.id].litros += it.qty;
    });
  });
  const detalle = Object.values(porProducto).map((p) => {
    const precioPromedio = p.litros > 0 ? p.ingresos / p.litros : 0;
    const utilidadLitro = precioPromedio - p.costo;
    return { nombre: p.nombre, costo: p.costo, precioPromedio, utilidadLitro, utilidadTotal: utilidadLitro * p.litros };
  }).sort((a, b) => b.utilidadTotal - a.utilidadTotal);

  return { ventasTotales, costoTotal, gastosTotal, utilidadNeta, margenBruto, margenNeto, detalle, numVentas: ventasSet.length };
}

function calcularUtilidadFiltrada(f) {
  const ventasSet = DB.ventas.filter((v) => ventaActiva(v) && pasaFiltroSucursal(v.sucursalId, f) && pasaFiltroFechaModo(v.fecha, f));
  const gastosSet = DB.gastos.filter((g) => pasaFiltroSucursal(g.sucursalId, f) && pasaFiltroFechaModo(g.fecha, f));
  return calcularUtilidad(ventasSet, gastosSet);
}

async function h_borrarUsuario(id) {
  if (!puedeBorrar()) return;
  const usuario = DB.usuarios.find((u) => u.id === id);
  if (!usuario) return;
  if (UI.session && usuario.nombre === UI.session.nombre) {
    alert('No puedes borrar el usuario con el que iniciaste sesión.');
    return;
  }
  if (!confirm(`¿Borrar al usuario "${usuario.nombre}"?`)) return;
  if (SUPABASE_ACTIVO && sb) {
    const { error } = await sb.rpc('borrar_usuario', { p_id: id });
    if (error) { alert('No se pudo borrar en el servidor: ' + error.message); return; }
  }
  db('usuarios', (list) => list.filter((u) => u.id !== id));
  render();
}

async function h_guardarUsuario() {
  const nombre = document.getElementById('uf-nombre').value.trim();
  const contrasena = document.getElementById('uf-contrasena').value.trim();
  const editando = UI.usuarios.editandoUsuario;
  if (!nombre) return;
  if (!SUPABASE_ACTIVO && !contrasena) return; // en modo local la contraseña siempre es obligatoria
  if (SUPABASE_ACTIVO && !editando && !contrasena) { alert('Ponle una contraseña al usuario nuevo.'); return; }

  const esOwner = !!editando && editando.rol === 'OWNER';
  const rolSelect = document.getElementById('uf-rol');
  const sucSelect = document.getElementById('uf-sucursal');
  const usuario = {
    id: editando ? editando.id : genId('user'),
    nombre,
    contrasena: contrasena || (editando ? editando.contrasena : ''),
    rol: esOwner ? 'OWNER' : (rolSelect ? rolSelect.value : 'ADMIN'),
    sucursalId: sucSelect && sucSelect.value ? sucSelect.value : null,
    creadoEn: editando ? editando.creadoEn : new Date().toISOString(),
  };

  if (SUPABASE_ACTIVO && sb) {
    // La contraseña en texto plano solo viaja en esta llamada; el servidor la
    // hashea y la guarda — nunca se sube en texto plano a ninguna tabla.
    const { error } = await sb.rpc('guardar_usuario', {
      p_id: usuario.id, p_nombre: usuario.nombre, p_password: contrasena || null,
      p_rol: usuario.rol, p_sucursal_id: usuario.sucursalId,
    });
    if (error) { alert('No se pudo guardar en el servidor: ' + error.message); return; }
  }

  db('usuarios', (list) => {
    const existe = list.some((u) => u.id === usuario.id);
    return existe ? list.map((u) => (u.id === usuario.id ? usuario : u)) : [...list, usuario];
  });
  UI.usuarios.formUsuarioOpen = false;
  render();
}

  if (!puedeBorrar()) return;
  const suc = DB.sucursales.find((s) => s.id === id);

  if (!confirm(`¿Borrar la sucursal "${suc.nombre}"?`)) return;
  db('sucursales', (list) => list.filter((s) => s.id !== id));
  db('inventario', (list) => list.filter((i) => i.sucursalId !== id));
  if (UI.sucursalActualId === id) {
    UI.sucursalActualId = (DB.sucursales[0] || {}).id || '';
    save('sucursal_actual', UI.sucursalActualId);
  }
  render();
}

function ticketsFiltrados() {
  const t = UI.tickets;
  let list = DB.ventas.slice();

  if (t.busquedaFolio.trim()) {
    const q = t.busquedaFolio.trim().toLowerCase();
    list = list.filter((v) => folioDeVenta(v).toLowerCase().includes(q) || v.id.toLowerCase().includes(q));
  }
  return list;
}

function h_exportarTicketsExcel() {
  const list = ticketsFiltrados();
  const filas = [];
  list.forEach((v) => {
    v.items.forEach((it) => {
      filas.push({
        folio: folioDeVenta(v), fecha: formatoFecha(v.fecha), hora: formatoHora(v.fecha), sucursal: v.sucursalNombre,
        vendedor: v.vendedor || '', cliente: v.clienteNombre || 'Publico General', metodoPago: v.payMethod || '',
        producto: it.nombre, cantidad: it.qty, precioUnitario: it.unitPrice, importe: it.lineTotal,
        totalTicket: v.total, estado: v.estado === 'cancelada' ? 'Cancelada' : 'Completada',
      });
    });
  });
  const header = ['folio', 'fecha', 'hora', 'sucursal', 'vendedor', 'cliente', 'metodoPago', 'producto', 'cantidad', 'precioUnitario', 'importe', 'totalTicket', 'estado'];
  const ws = XLSX.utils.json_to_sheet(filas, { header });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Ventas');
  XLSX.writeFile(wb, 'ventas_emilimpio_' + isoHoy() + '.xlsx');
}

function h_guardarEdicionTicket() {
  const draft = UI.tickets.editando;
  if (!draft) return;
  const original = DB.ventas.find((v) => v.id === draft.id);
  if (!original) return;

  const lineas = [];
  const deltasStock = [];
  draft.items.forEach((it, i) => {
    const input = document.getElementById('te-qty-' + i);
    const nuevaQty = Math.max(0, Number(input ? input.value : it.qty) || 0);
    const producto = DB.productos.find((p) => p.id === it.id);
    deltasStock.push({ productoId: it.id, delta: Number((it.qty - nuevaQty).toFixed(2)) });
    if (nuevaQty > 0 && producto) lineas.push({ producto, qty: nuevaQty });
  });

  if (lineas.length === 0) {
    alert('El ticket debe tener al menos un producto. Si quieres anularlo por completo usa "Cancelar ticket".');
    return;
  }

  const c = calcularCarrito(lineas);
  deltasStock.forEach((d) => { if (d.delta !== 0) ajustarStock(original.sucursalId, d.productoId, d.delta); });

  const totalAnterior = original.total;
  const ventaActualizada = {
    ...original,
    items: c.lineas, subtotalMenudeo: c.subtotalMenudeo, ahorro: c.ahorro, total: c.total, mayoreo: c.mayoreoActivo,
    editadoEn: new Date().toISOString(),
  };
  db('ventas', (list) => list.map((v) => (v.id === original.id ? ventaActualizada : v)));

  if (original.clienteId) {
    const diff = Number((c.total - totalAnterior).toFixed(2));
    db('clientes', (cs) => cs.map((cl) => cl.id === original.clienteId ? { ...cl, totalGastado: Math.max(0, Number((cl.totalGastado + diff).toFixed(2))) } : cl));
  }

  UI.tickets.editando = null;
  UI.tickets.detalleId = null;
  render();
}

function h_cancelarTicket(id) {
  const venta = DB.ventas.find((v) => v.id === id);
  if (!venta || venta.estado === 'cancelada') return;
  if (!confirm(`¿Cancelar el ticket ${folioDeVenta(venta)} por ${formatoMoneda(venta.total)}? El producto se regresará al inventario de ${venta.sucursalNombre}.`)) return;

  venta.items.forEach((it) => ajustarStock(venta.sucursalId, it.id, it.qty));

  if (venta.clienteId) {
    db('clientes', (cs) => cs.map((cl) => cl.id === venta.clienteId
      ? { ...cl, compras: Math.max(0, cl.compras - 1), totalGastado: Math.max(0, Number((cl.totalGastado - venta.total).toFixed(2))) }
      : cl));
  }

  db('ventas', (list) => list.map((v) => (v.id === id ? { ...v, estado: 'cancelada', canceladoEn: new Date().toISOString() } : v)));

  UI.tickets.detalleId = null;
  UI.tickets.editando = null;
  render();
}
